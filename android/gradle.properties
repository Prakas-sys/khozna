# JVM memory — tuned for stable builds
org.gradle.jvmargs=-Xmx2048m -XX:+UseG1GC -XX:MaxMetaspaceSize=512m
kotlin.daemon.jvmargs=-Xmx1024m -XX:+UseG1GC -XX:MaxMetaspaceSize=256m


# Build stability
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
kotlin.incremental=false

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# R8/D8 — keep full mode OFF for debug, reduce memory pressure
android.enableR8.fullMode=false

# Suppress legacy warnings
android.suppressUnsupportedCompileSdk=34


