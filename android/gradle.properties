# JVM memory — tuned for host RAM limits (prevents native malloc OOM crash)
org.gradle.jvmargs=-Xmx1536m -XX:+UseG1GC -XX:MaxMetaspaceSize=384m
kotlin.daemon.jvmargs=-Xmx768m -XX:+UseG1GC -XX:MaxMetaspaceSize=192m


# Build stability
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=false
kotlin.incremental=false

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# R8/D8 — keep full mode OFF for debug, reduce memory pressure
android.enableR8.fullMode=false

# Suppress legacy warnings
android.suppressUnsupportedCompileSdk=34


